<!DOCTYPE html>
<html lang="en" style="
--g1: #6bf3fc;
--g2: #33ccee;
--g3: #2299dd;
--g4: #0b58b3;
">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>

  {% block icon %}
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/default.png') }}">
  {% endblock %}

  <style>
    :root {
      --bg:#fbfcfd;
      --card:#ffffff;
      --text: #0f172a;
      --muted:#6b7280;
      --accent:#2563eb;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui; 
      background:var(--bg); 
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
      margin: 0; 
      padding: 2rem;
    }

    body.dark {
      --bg: #0b1220;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
    }

    .container {
      max-width:880px;
      margin:0 auto;
    }

    header {
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:1.5rem;
    }

    .logo {
      width:56px;
      height:56px;
      border-radius:8px;
      background:linear-gradient(135deg,var(--accent),#06b6d4);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:700;
    }
    
    h1 {
      font-size:1.5rem;
      margin:0;
    }

    nav a {
      color:var(--muted);
      text-decoration:none;
      margin-right: 1rem;
    }

    main {
      background:var(--card);
      padding:2rem;border-radius:12px;
      box-shadow:0 6px 18px rgba(2,6,23,0.06);
    }

    .meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    pre {
      background: #0b1220;
      color: #e6eef8;
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New";
    }

    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .lesson-item {
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid #eef2ff;
    }

    a.button {
      display: inline-block;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      text-decoration: none;
    }
    .theme-button {
      cursor: pointer;
      font-size: 1.4rem;
      background: none;
      border: none;
      margin-left: auto;
      color: var(--text);
    }

    footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='styles/style.css')}}">
  <link rel="icon" type="image/png" href="icons/blog.png">
  <link rel="stylesheet" type="text/css" href="styles/style.css">
  <script src="https://unpkg.com/image-map-resizer@1.0.10/js/imageMapResizer.min.js">
  </script>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo aurora-input">CALM</div>
      <div>
        <h1>Calm-Style Lessons</h1>
        <div class="meta">Lecții scurte. Programează. Clar. Calm. Coerent. Corelat. Relaxat. Degajat</div>
      </div>
      <nav class="aurora-nav aurora-input" style="margin-left:auto">
        <a href="{{ url_for('index') }}" class="aurora-button">Home</a>
        <a href="{{ url_for('about') }}" class="aurora-button">Despre</a>
        <a href="{{ url_for('blog') }}" class="aurora-button">Blog</a>
        <a href="{{ url_for('contact') }}" class="aurora-button">Contact</a>
        <a href="{{ url_for('faq') }}" class="aurora-button">FAQ</a>
        <a href="{{ url_for('services') }}" class="aurora-button">Servicii</a>
      </nav>
      <button id="theme-toggle" class="theme-button">
          🌓
      </button>
    </header>

    <main class="aurora-label">
      {% block content %}{% endblock %}
    </main>

    <footer class="system-footer">
      <p>© 2025 — stil inspirat de 
        <a href="https://calmcode.io" target="_blank">calmcode.io</a>
      </p>
      <p>Created by Alin Roșca  © 2025 
      </p>
    </footer>
  </div>
  <script>
    const evtSource = new EventSource("/livereload");
    evtSource.onmessage = function(e) {
        if (e.data === "reload") {
            console.log("🔄 Live reload triggered");
            location.reload();
        }
    };

    // load saved theme
    if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark");
    }

    document.getElementById("theme-toggle").addEventListener("click", () => {
        document.body.classList.toggle("dark");

        // save preference
        if (document.body.classList.contains("dark")) {
            localStorage.setItem("theme", "dark");
        } else {
            localStorage.setItem("theme", "light");
        }
    });

    // auto-detect system dark mode if first visit
    if (!localStorage.getItem("theme")) {
        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            document.body.classList.add("dark");
            localStorage.setItem("theme", "dark");
        }
    }

    /*
        Dark Mode logic:
        - Dacă userul a selectat deja (localStorage), folosim preferința lui.
        - Dacă nu, atunci se activează automat între 18:00–06:00.
    */

    const saved = localStorage.getItem("theme");

    function applyTheme(theme) {
        if (theme === "dark") {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }

    if (saved) {
        // User preference has priority
        applyTheme(saved);
    } else {
        // AUTO mode based on hour
        const hour = new Date().getHours();

        // 18:00 → 23:59 OR 00:00 → 06:00
        const isNight = (hour >= 18 || hour < 6);

        applyTheme(isNight ? "dark" : "light");
    }

    // Toggle button logic
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
    });
</script>
</body>
</html>
