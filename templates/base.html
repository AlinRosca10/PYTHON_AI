<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>

  {% block icon %}
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/default.png') }}">
  {% endblock %}

  <style>
    :root {
      --bg: #fbfcfd;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #6b7280;
      --accent: #2563eb;
      --g1: #6bf3fc;
      --g2: #33ccee;
      --g3: #2299dd;
      --g4: #0b58b3;
    }

    /* PALETE — afectează doar culorile decorative */
    :root[data-palette="ocean"] {
        --g1: #6bf3fc;
        --g2: #33ccee;
        --g3: #2299dd;
        --g4: #0b58b3;
    }

    :root[data-palette="sunset"] {
        --g1: #ff9a8b;
        --g2: #ff6a88;
        --g3: #ff99ac;
        --g4: #d4145a;
    }

    :root[data-palette="forest"] {
        --g1: #a8e6cf;
        --g2: #56c596;
        --g3: #379683;
        --g4: #0b8457;
    }

    :root[data-palette="darkness"] {
        --g1: #1a1a1a;
        --g2: #2d2d2d;
        --g3: #3c3c3c;
        --g4: #555;
    }

    /* MODURI — afectează structural UI-ul (fundal, text etc) */
    :root[data-mode="light"] {
        --bg: #fbfcfd;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #6b7280;
        --accent: #2563eb;
    }

    :root[data-mode="dark"] {
        --bg: #0b1220;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
    }

    body {
      font-family: Inter, ui-sans-serif, system-ui; 
      background:var(--bg); 
      color: var(--text);
      transition: background 0.9s ease, color 0.9s ease, opacity 0.9s ease;
      opacity: 1;
      margin: 0; 
      padding: 2rem;
    }

    body.dark {
      --bg: #0b1220;
      --card: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      transition: background 0.7s ease, color 0.7s ease, opacity 0.7s ease;
      opacity: 0.6; 
    }

    /* fade-in smooth */
    body.fade-transition {
        transition: background 0.7s ease, color 0.7s ease, opacity 0.7s ease;
        opacity: 0.6;
    }

    .container {
      max-width:880px;
      margin:0 auto;
    }

    header {
      display:flex;
      align-items:center;
      gap:16px;
      margin-bottom:1.5rem;
    }

    .logo {
      width:56px;
      height:56px;
      border-radius:8px;
      background:linear-gradient(135deg,var(--accent),#06b6d4);
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      font-weight:700;
    }
    
    h1 {
      font-size:1.5rem;
      margin:0;
    }

    nav a {
      color:var(--muted);
      text-decoration:none;
      margin-right: 1rem;
    }

    main {
      background:var(--card);
      padding:2rem;border-radius:12px;
      box-shadow:0 6px 18px rgba(2,6,23,0.06);
    }

    .meta {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    pre {
      background: #0b1220;
      color: #e6eef8;
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", "Courier New";
    }

    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .lesson-item {
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid #eef2ff;
    }

    a.button {
      display: inline-block;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      text-decoration: none;
    }
    .theme-button {
      cursor: pointer;
      font-size: 1.4rem;
      background: none;
      border: none;
      margin-left: auto;
      color: var(--text);
    }

    footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
  <link rel="stylesheet" type="text/css" href="{{url_for('static', filename='styles/style.css')}}">
  <link rel="icon" type="image/png" href="icons/blog.png">
  <script src="https://unpkg.com/image-map-resizer@1.0.10/js/imageMapResizer.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo aurora-input">CALM</div>
      <div>
        <h1>Calm-Style Lessons</h1>
        <div class="meta">Lecții scurte. Programează. Clar. Calm. Coerent. Corelat. Relaxat. Degajat</div>
      </div>
      <nav class="aurora-nav aurora-input" style="margin-left:auto">
        <a href="{{ url_for('index') }}" class="aurora-button">Home</a>
        <a href="{{ url_for('about') }}" class="aurora-button">Despre</a>
        <a href="{{ url_for('blog') }}" class="aurora-button">Blog</a>
        <a href="{{ url_for('contact') }}" class="aurora-button">Contact</a>
        <a href="{{ url_for('faq') }}" class="aurora-button">FAQ</a>
        <a href="{{ url_for('services') }}" class="aurora-button">Servicii</a>
      </nav>
      <button id="theme-toggle" class="theme-button">
          🌓
      </button>
    </header>

    <main class="aurora-label">
      {% block content %}{% endblock %}
    </main>

    <footer class="system-footer">
      <div class="footer-flex">


          <section class="image-side-content" width="120px">
            <button class="aurora-button" alt="Settings and properties menu CALM">
              <img src="{{ url_for('static', filename='icons/combo.png') }}" style="height: 30px">
              <select id="palette-picker">
                  <option value="ocean">Ocean</option>
                  <option value="sunset">Sunset</option>
                  <option value="forest">Forest</option>
                  <option value="darkness">Dark</option>
              </select>
            </button>
          </section>

          <section class="footer-text">
            <p>© 2025 — stil inspirat de 
              <a href="https://calmcode.io" target="_blank">calmcode.io</a>
            </p>
            <p>Created by Alin Roșca  © 2025 
            </p>
          </section>


        </div>
    </footer>
  </div>
  <script>
    const evtSource = new EventSource("/livereload");
    evtSource.onmessage = function(e) {
        if (e.data === "reload") {
            console.log("🔄 Live reload triggered");
            location.reload();
        }
    };

    const emojiBtn = document.getElementById("theme-toggle");

    function animateEmoji(isDark) {
        let frames = isDark
            ? ["🌓", "🌘", "🌙"]   // Light → Dark
            : ["🌙", "🌒", "✨"];   // Dark → Light

        let i = 0;
        const interval = setInterval(() => {
            emojiBtn.textContent = frames[i];
            i++;
            if (i === frames.length) clearInterval(interval);
        }, 60); // viteza fiecărei faze
    }

    /*  ---------------- DARK MODE INTELIGENT ----------------
        ✔ Preferință utilizator → are prioritate absolută
        ✔ Prima vizită → detectare automată
        ✔ Auto schimbare la 18:00 / 06:00
        ✔ Cron → verificare la fiecare minut
        ✔ Tranziție animată fade
        ----------------------------------------------------- */

    function applyTheme(theme, withFade = false) {
        const isDark = theme === "dark"
        if (withFade) {
            document.body.classList.add("fade-transition");
            setTimeout(() => {
                document.body.classList.remove("fade-transition");
            }, 500);
        }

        if (isDark) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }

        // 🔥 Actualizăm emoji-ul aici
        animateEmoji(isDark);
    }

    function isNightTime() {
        const hour = new Date().getHours();
        return (hour >= 18 || hour < 6);
    }

    // 1. Verificăm preferința salvată (user choice)
    const saved = localStorage.getItem("theme");

    if (saved) {
        applyTheme(saved);
    } else {
        // 2. Prima vizită → stabilim în funcție de oră
        applyTheme(isNightTime() ? "dark" : "light");
    }

    // 3. Toggle manual (în acest caz *blochează* detectarea automată)
    document.getElementById("theme-toggle").addEventListener("click", () => {
        const isDark = document.body.classList.toggle("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        applyTheme(isDark ? "dark" : "light", true);
    });

    // 4. CRON → verificare la fiecare minut
    setInterval(() => {
        // Dacă userul a setat manual → nu mai schimbăm automat
        if (localStorage.getItem("theme")) return;

        const shouldBeDark = isNightTime();
        const currentlyDark = document.body.classList.contains("dark");

        if (shouldBeDark !== currentlyDark) {
            applyTheme(shouldBeDark ? "dark" : "light", true);
        }
    }, 60 * 1000); // 1 minut
  </script>
  <script type="text/javascript" src="{{url_for('static', filename='scripts/theme_engine.js')}}"></script>
</body>
</html>
